name: R6 Esports - Hourly Results

on:
  schedule:
    # Every hour at xx:10 KST (and xx:10 UTC, offset is a whole number of hours).
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6-hourly-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check finished R6 matches and send new results
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python r6_hourly_github.py

      # Save state even if a later send fails, so earlier successful sends
      # don't need to be repeated. A remote git push failure can still cause
      # duplicates; check the workflow log if that occurs.
      - name: Save previously sent match IDs
        if: always()
        shell: bash
        run: |
          if [ ! -f state/seen.json ]; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Update R6 notification history [skip ci]"
            git push
          fi
